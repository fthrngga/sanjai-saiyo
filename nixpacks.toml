# nixpacks.toml
# Konfigurasi Nixpacks untuk deployment Laravel + React/Vite di Railway

# Menyertakan Node.js pada lingkungan build agar kita dapat mengompilasi aset Vite
[phases.setup]
nixPkgs = ["...", "nodejs"]

# Melakukan instalasi dependensi frontend (NPM) dan mengompilasi aset untuk produksi
[phases.build]
cmds = [
    "composer install --no-interaction --prefer-dist --optimize-autoloader",
    "npm ci",
    "npm run build"
]

# Menentukan Nginx document root untuk Laravel (yaitu folder public)
[variables]
    NIXPACKS_PHP_ROOT_DIR = "/app/public"
